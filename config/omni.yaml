# 相机驱动配置（内参 + 采集参数）
camera: 
  # 相机类型：hik（海康）/ mv（迈德威视）
  type: hik
  # 海康相机采集参数
  hik_camera:
    #target_sn: DA4973922 #海康2
    target_sn: 00J38611357 #海康1
    # ADC 位深：Bits_8 / Bits_10 / Bits_12
    adc_bit_depth: Bits_8
    # 像素格式：BayerRG8 / RGB8Packed 等
    pixel_format: BayerRG8 #RGB8Packed
    # 软件水平翻转（与 flip 二选一）
    reverse_x: false
    # 软件垂直翻转
    reverse_y: false
    # 采集宽度（像素）
    width: 1280
    # 采集高度（像素）
    height: 720
    # ROI 是否自动居中（true 时下面 offset 无效）
    center_roi: true    # OffsetX/OffsetY 按 WidthMax/HeightMax 自动居中，不写死
    # ROI 左上角 x（center_roi=false 时生效）
    offset_x: 0         # 仅 center_roi=false 时生效
    # ROI 左上角 y
    offset_y: 0
    # 倒装补偿：none / vertical / horizontal / 180
    flip: "180"         # 相机倒装补偿：none/vertical/horizontal/180，识别前软件翻转
    # 是否启用固定采集帧率
    acquisition_frame_rate_enable: true
    # 180 fps → 每帧约 5.56ms；配合 auto_exposure.exposure_max=3500µs 留出约 2.06ms
    # 余量，避免 MV_CC_GetImageBuffer fail (MV_E_NODATA，取流超时)。
    # 检测侧本来就只跑 ~100fps，180 对性能没有影响。
    # 若相机 USB 复位/掉线变频繁，可降到 120 应急（166MB/s -> 110MB/s）。
    acquisition_frame_rate: 180
    # Hik 启动时的曝光初值，单位 µs；auto_exposure.enable=true 时随后由自动曝光覆盖
    exposure_time: 2000
    # 模拟增益，单位 dB；当前固定为 16.9，不随自动曝光变化，增大也会增加噪声
    gain: 16.9
    # Gamma；当前 BayerRG8 格式下驱动不设置此项，仅 RGB/BGR 格式可写
    gamma: 0.7
    # 触发模式：Off=自由运行；On=外部触发
    trigger_mode: Off
    # 触发源（Line0 等，trigger_mode=On 时用）
    trigger_source: ""
    # 触发沿：RisingEdge / FallingEdge
    trigger_activation: ""
    # 输出格式：bgr / rgb / gray
    format: "bgr" 
    # 是否用 CUDA 做格式转换（无 GPU 时无效）
    use_cuda_cvt: true
  # 迈德威视相机采集参数
  mv_camera:
    # 帧率设置（0=自动）
    frame_speed: 0
    # 曝光 µs
    exposure_time: 2000
    # 红通道增益
    r_gain: 200
    # 蓝通道增益
    b_gain: 150
    # 绿通道增益
    g_gain: 200
    # analog_gain: 100.0
    # gamma: 120
  camera_info:
    #8mm
    # image_width: 1440
    # image_height: 1080
    # camera_name: narrow_stereo
    # camera_matrix:
    #   rows: 3
    #   cols: 3
    #   data: [2419.64498,    0.     ,  719.05623,
    #             0.     , 2414.38209,  538.71651,
    #             0.     ,    0.     ,    1.     ]
    # distortion_model: plumb_bob
    # distortion_coefficients:
    #   rows: 1
    #   cols: 5
    #   data: [-0.033521, 0.087954, -0.002045, -0.001438, 0.000000]
    # rectification_matrix:
    #   rows: 3
    #   cols: 3
    #   data: [1., 0., 0.,
    #          0., 1., 0.,
    #          0., 0., 1.]
    # projection_matrix:
    #   rows: 3
    #   cols: 4
    #   data: [2413.22632,    0.     ,  717.5196 ,    0.     ,
    #             0.     , 2408.83228,  537.43444,    0.     ,
    #             0.     ,    0.     ,    1.     ,    0.     ]
    #6mm

    image_width: 1280
    # 标定图像高度（必须与实际采集一致）
    image_height: 720
    # 相机名（ROS 消息里的名称）
    camera_name: narrow_stereo
    # 内参矩阵 K：[fx,0,cx / 0,fy,cy / 0,0,1]
    camera_matrix:
      # 矩阵行数（3）
      rows: 3
      # 矩阵列数（3）
      cols: 3
      # data: [1796.894429809793,    0.     ,  620.0261636808025,
      #           0.     , 1796.931221518718,  379.0978347802621,
      #           0.     ,    0.     ,    1.     ]
      data: [1796.894429809793,    0.     ,  658.0261636808025,
                0.     , 1796.931221518718,  379.0978347802621,
                0.     ,    0.     ,    1.     ]
    # 畸变模型：plumb_bob / rational_polynomial
    distortion_model: plumb_bob
    # 畸变系数 k1,k2,p1,p2,k3
    distortion_coefficients:
      # 行数（1）
      rows: 1
      # 列数（5）
      cols: 5
      # 畸变系数值（顺序 k1,k2,p1,p2,k3）
      data: [-0.08924019639253641, 0.3763627652210577, -0.000139574350781996, -0.001426088285025369, -1.627646070279677]
    # 校正矩阵（单目恒为单位阵）
    rectification_matrix:
      # 行数（3）
      rows: 3
      # 列数（3）
      cols: 3
      # 校正矩阵元素（单位阵）
      data: [1., 0., 0.,
            0., 1., 0.,
            0., 0., 1.]
    # 投影矩阵 P（ROS 相机模型用）
    projection_matrix:
      # 行数（3）
      rows: 3
      # 列数（4）
      cols: 4
      # 投影矩阵元素（fx,0,cx,0 / 0,fy,cy,0 / 0,0,1,0）
      data: [1796.894429809793,    0.     ,  620.0261636808025,    0.     ,
                0.     , 1796.931221518718,  379.0978347802621,    0.     ,
                0.     ,    0.     ,    1.     ,    0.     ]
